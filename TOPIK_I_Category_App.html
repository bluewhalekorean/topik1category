<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TOPIK I 상황별 단어장</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--sw:268px;--hh:52px}
body{font-family:'Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif;background:#eef2f7;color:#222}

/* Header */
#hdr{position:fixed;top:0;left:0;right:0;height:var(--hh);
  background:linear-gradient(135deg,#1a3a5c,#1e4d7b);color:#fff;
  display:flex;align-items:center;padding:0 16px;z-index:300;gap:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.3)}
#hbg{font-size:1.4rem;cursor:pointer;display:none;background:none;border:none;color:#fff}
.hdrtxt .sub{font-size:.68rem;opacity:.65}
.hdrtxt h1{font-size:.98rem;font-weight:700}
#srch{margin-left:auto;padding:6px 14px;border-radius:20px;border:none;
  background:rgba(255,255,255,.15);color:#fff;font-size:.82rem;width:180px;outline:none}
#srch::placeholder{color:rgba(255,255,255,.5)}

/* Sidebar */
#sb{position:fixed;top:var(--hh);left:0;width:var(--sw);
  height:calc(100vh - var(--hh));overflow-y:auto;
  background:#fff;border-right:1px solid #dce4ef;z-index:200}
#sb::-webkit-scrollbar{width:4px}
#sb::-webkit-scrollbar-thumb{background:#cdd5e0;border-radius:2px}
.ci{padding:9px 14px 9px 16px;cursor:pointer;border-left:4px solid transparent;
  display:flex;align-items:flex-start;gap:9px;transition:.12s}
.ci:hover{background:#f4f7fc}
.ci.active{background:#eef3ff;border-left-color:var(--cc)}
.cn{font-size:.66rem;font-weight:700;color:#aaa;min-width:20px;padding-top:2px}
.cl{flex:1}
.cko{font-size:.84rem;font-weight:700;color:#1a3a5c}
.cen{font-size:.68rem;color:#888;margin-top:1px}
.cnt{font-size:.68rem;color:#aaa;white-space:nowrap;padding-top:2px}

/* Main */
#main{margin-left:var(--sw);margin-top:var(--hh);padding:22px;min-height:calc(100vh - var(--hh))}

/* Category header */
.ch{border-radius:12px;padding:16px 20px;color:#fff;margin-bottom:18px;
  display:flex;justify-content:space-between;align-items:center;
  flex-wrap:wrap;gap:10px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.ch .tko{font-size:1.3rem;font-weight:800}
.ch .ten{font-size:.84rem;opacity:.85;margin-top:2px}
.ch .wc{font-size:.78rem;opacity:.75;text-align:right;line-height:1.6}

/* Mode bar */
.modebar{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.mbtn{padding:7px 18px;border-radius:20px;border:2px solid transparent;
  cursor:pointer;font-size:.84rem;font-weight:700;
  background:#fff;color:#667;transition:.15s;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.mbtn:hover{background:#f0f4ff}
.mbtn.active{color:#fff;border-color:transparent}

/* ── LIST VIEW ─────────────────────────────────────── */
.blk{margin-bottom:20px;border-radius:10px;overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.08);background:#fff}
.bh{display:flex;align-items:center;justify-content:space-between;
  padding:7px 16px;color:#fff;font-weight:700;font-size:.82rem}
.fbt{padding:3px 12px;border-radius:12px;border:none;cursor:pointer;
  background:rgba(255,255,255,.25);color:#fff;font-size:.75rem;font-weight:700}
.fbt:hover{background:rgba(255,255,255,.4)}
.wt{width:100%;border-collapse:collapse}
.wt th{padding:7px 11px;font-size:.78rem;font-weight:700;color:#667;
  background:#f8fafc;border-bottom:2px solid #e6ecf5;text-align:left}
.wt th:first-child,.wt td:first-child{text-align:center;width:44px}
.wt td{padding:8px 11px;border-bottom:1px solid #edf1f8;font-size:.88rem;vertical-align:top}
.wt tr:last-child td{border-bottom:none}
.wt tr:hover td{background:#f6f9ff}
.kc{font-weight:700;color:#1a3a5c;font-size:.97rem}
.ec{color:#444}
.sc{font-size:.78rem;color:#666;margin-top:3px;font-style:italic}
.tb{background:none;border:none;cursor:pointer;font-size:.95rem;
  opacity:.5;padding:3px 5px;border-radius:5px;transition:.15s}
.tb:hover{opacity:1;background:#f0f4ff}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.25)}100%{transform:scale(1)}}
.spk{opacity:1;animation:pulse .5s infinite}

/* ── CARD VIEW ─────────────────────────────────────── */
#kv{max-width:560px;margin:0 auto}
.sf-bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.sfbtn{padding:5px 14px;border-radius:16px;border:none;cursor:pointer;
  font-size:.78rem;font-weight:700;background:#e8edf5;color:#555;transition:.15s}
.sfbtn:hover{background:#d0d8e8}
.sfbtn.active{color:#fff}
.dir-bar{display:flex;gap:6px;margin-bottom:16px}
.dbtn{padding:5px 16px;border-radius:16px;border:2px solid #dde3ef;
  cursor:pointer;font-size:.8rem;font-weight:700;background:#fff;color:#667;transition:.15s}
.dbtn.active{background:#1a3a5c;color:#fff;border-color:#1a3a5c}

/* progress bar */
.pgbar{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.pgtrack{flex:1;height:8px;background:#e4ecf7;border-radius:4px;overflow:hidden}
.pgfill{height:100%;border-radius:4px;transition:width .3s}
.pgnum{font-size:.8rem;color:#888;min-width:52px;text-align:right}

/* card itself */
.card-wrap{perspective:1000px;margin-bottom:20px}
.card{background:#fff;border-radius:16px;min-height:220px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;padding:28px 24px;text-align:center;
  box-shadow:0 4px 20px rgba(0,0,0,.12);transition:box-shadow .15s;
  user-select:none;position:relative}
.card:hover{box-shadow:0 6px 28px rgba(0,0,0,.18)}
.card-front,.card-back{width:100%}
.cf-ko{font-size:1.8rem;font-weight:800;color:#1a3a5c;margin-bottom:10px}
.cf-hint{font-size:.75rem;color:#ccc;margin-top:8px}
.cb-en{font-size:1.3rem;font-weight:700;color:#1a3a5c;margin-bottom:10px}
.cb-sen{font-size:.92rem;color:#555;margin-bottom:10px;font-style:italic}
.card-tts-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:4px}
.ctts{padding:5px 14px;border-radius:12px;border:none;cursor:pointer;
  font-size:.8rem;font-weight:600;background:#f0f4ff;color:#1a3a5c;transition:.15s}
.ctts:hover{background:#dce4ff}
.card-nav{display:flex;align-items:center;justify-content:center;gap:16px}
.cnav{padding:8px 24px;border-radius:20px;border:none;cursor:pointer;
  font-weight:700;font-size:.9rem;background:#fff;color:#1a3a5c;
  box-shadow:0 2px 8px rgba(0,0,0,.12);transition:.15s}
.cnav:hover{background:#eef3ff}
.cflipbtn{padding:8px 20px;border-radius:20px;border:none;cursor:pointer;
  font-weight:700;font-size:.85rem;color:#fff;transition:.15s}

/* ── QUIZ VIEW ─────────────────────────────────────── */
#qv{max-width:560px;margin:0 auto}
.qhdr{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.qscore{font-size:.92rem;font-weight:700;color:#1a3a5c;background:#eef3ff;
  padding:6px 14px;border-radius:20px}
.qreset{padding:5px 14px;border-radius:16px;border:none;cursor:pointer;
  font-size:.78rem;font-weight:700;background:#f0f0f0;color:#666;transition:.15s}
.qreset:hover{background:#e0e0e0}
.qdir{display:flex;gap:6px;margin-bottom:16px}
.qdbtn{padding:5px 16px;border-radius:16px;border:2px solid #dde3ef;
  cursor:pointer;font-size:.8rem;font-weight:700;background:#fff;color:#667}
.qdbtk.active,.qdbtk:focus{background:#1a3a5c;color:#fff;border-color:#1a3a5c}
.qcard{background:#fff;border-radius:14px;padding:28px 24px;text-align:center;
  box-shadow:0 4px 16px rgba(0,0,0,.1);margin-bottom:18px;min-height:100px;
  display:flex;flex-direction:column;align-items:center;justify-content:center}
.qword{font-size:1.6rem;font-weight:800;color:#1a3a5c;margin-bottom:6px}
.qpron{font-size:.82rem;color:#aaa}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.opt{padding:12px 10px;border-radius:10px;border:2px solid #dde3ef;
  cursor:pointer;font-size:.88rem;font-weight:600;background:#fff;
  color:#333;text-align:left;transition:.15s;line-height:1.4}
.opt:hover:not(:disabled){background:#f0f5ff;border-color:#a0b4d4}
.opt.correct{background:#e8f5e9;border-color:#4caf50;color:#2e7d32}
.opt.wrong{background:#fce4ec;border-color:#e91e63;color:#b71c1c}
.opt:disabled{cursor:default}
.qnext{display:none;width:100%;padding:11px;border-radius:10px;border:none;
  cursor:pointer;font-size:.9rem;font-weight:700;
  background:#1a3a5c;color:#fff;transition:.15s}
.qnext:hover{background:#1e4d7b}
.qprogbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}

/* ── FLASHCARD MODAL ───────────────────────────────── */
#fco{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);
  z-index:600;align-items:center;justify-content:center}
#fco.on{display:flex}
#fcb{background:#fff;border-radius:18px;width:440px;max-width:94vw;
  padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.3);position:relative}
#fcc{position:absolute;top:12px;right:16px;font-size:1.3rem;
  cursor:pointer;color:#aaa;background:none;border:none}
#fct{font-size:.72rem;font-weight:700;color:#aaa;text-align:center;
  margin-bottom:14px;letter-spacing:.5px;text-transform:uppercase}
#fcd{background:#f7f9fc;border-radius:14px;min-height:180px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;padding:24px;border:2px solid #e4ecf7;user-select:none;
  transition:background .15s;text-align:center}
#fcd:hover{background:#eef2ff}
#fcf{font-size:1.6rem;font-weight:800;color:#1a3a5c}
#fcen{font-size:1.15rem;font-weight:700;color:#1a3a5c;display:none;margin-bottom:6px}
#fcsen{font-size:.9rem;color:#555;display:none;margin-top:4px;font-style:italic}
#fch{font-size:.72rem;color:#ccc;margin-top:10px}
.fcn{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:14px}
.fnb{padding:7px 20px;border-radius:20px;border:none;cursor:pointer;
  font-weight:700;font-size:.85rem;background:#e8edf5;color:#555}
.fnb:hover{background:#d0d8e8}
#fck{font-size:.85rem;color:#aaa;min-width:56px;text-align:center}
.fcbtns{display:flex;gap:8px;margin-top:12px}
.fcbt{flex:1;padding:8px;border-radius:9px;border:none;cursor:pointer;
  font-size:.82rem;font-weight:700;background:#e8edf5;color:#555}
.fcbt:hover{background:#d0d8e8}

/* Welcome */
#wel{text-align:center;padding:70px 20px;color:#667}
#wel h2{font-size:1.55rem;color:#1a3a5c;margin-bottom:12px}
#wel p{line-height:2;font-size:.93rem}

/* Search */
#sv{display:none}
.stag{display:inline-block;padding:2px 9px;border-radius:10px;
  font-size:.7rem;color:#fff;font-weight:700;white-space:nowrap}

/* Mobile */
@media(max-width:700px){
  #hbg{display:block}
  #sb{transform:translateX(-100%);transition:transform .25s}
  #sb.open{transform:translateX(0)}
  #main{margin-left:0;padding:12px}
  #srch{width:120px}
  .qopts{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div id="hdr">
  <button id="hbg" onclick="toggleSB()">☰</button>
  <div class="hdrtxt">
    <div class="sub">TOPIK I · 1,671단어 · 20 Categories</div>
    <h1>상황별 단어장 · Vocabulary by Situation</h1>
  </div>
  <input id="srch" type="text" placeholder="🔍 검색..." oninput="doSearch(this.value)">
</div>

<div id="sb"><div id="clist"></div></div>

<div id="main">
  <div id="wel">
    <h2>📚 TOPIK I 상황별 단어장</h2>
    <p>총 <strong>1,671단어</strong>를 <strong>20가지 상황별 카테고리</strong>로 구성했습니다.<br>
    Organized 1,671 words into 20 real-life situational categories.<br><br>
    ← 왼쪽에서 카테고리를 선택하세요<br>
    <em style="font-size:.85rem">📋 목록 · 🃏 카드 · ❓ 퀴즈 세 가지 학습 모드를 제공합니다</em></p>
  </div>

  <div id="cv" style="display:none">
    <div id="cat-hdr" class="ch"></div>
    <div class="modebar">
      <button class="mbtn active" id="mb-list" onclick="setMode('list')">📋 목록 보기</button>
      <button class="mbtn" id="mb-card" onclick="setMode('card')">🃏 카드 보기</button>
      <button class="mbtn" id="mb-quiz" onclick="setMode('quiz')">❓ 퀴즈</button>
    </div>
    <div id="lv"></div>
    <div id="kv" style="display:none"></div>
    <div id="qv" style="display:none"></div>
  </div>

  <div id="sv">
    <h2 style="margin-bottom:14px;color:#1a3a5c">🔍 검색 결과</h2>
    <div id="so"></div>
  </div>
</div>

<!-- Flashcard modal -->
<div id="fco" onclick="fcoOut(event)">
  <div id="fcb">
    <button id="fcc" onclick="closeFC()">✕</button>
    <div id="fct"></div>
    <div id="fcd" onclick="fcFlip()">
      <div id="fcf"></div>
      <div id="fcen"></div>
      <div id="fcsen"></div>
      <div id="fch">탭하여 뒤집기 · tap to flip</div>
    </div>
    <div class="fcn">
      <button class="fnb" onclick="fcmv(-1)">← 이전</button>
      <span id="fck"></span>
      <button class="fnb" onclick="fcmv(1)">다음 →</button>
    </div>
    <div class="fcbtns">
      <button class="fcbt" onclick="fcSpeak('k')">🔊 단어</button>
      <button class="fcbt" onclick="fcSpeak('s')">📢 예문</button>
      <button class="fcbt" onclick="fcShuffle()">🔀 섞기</button>
    </div>
  </div>
</div>

// ── TTS ──────────────────────────────────────────────
let _tb=null;
function speak(t,b){
  if(!t||t==='nan')return;
  if(_tb)_tb.classList.remove('spk');
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);
  u.lang='ko-KR';u.rate=.88;
  if(b){_tb=b;b.classList.add('spk');}
  u.onend=()=>{if(_tb)_tb.classList.remove('spk');_tb=null;};
  speechSynthesis.speak(u);
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function escq(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");}

// ── Sidebar ───────────────────────────────────────────
function renderSidebar(){
  document.getElementById('clist').innerHTML=DATA.map(c=>
    `<div class="ci" id="ci${c.id}" style="--cc:${c.color}" onclick="showCat(${c.id})">
      <span class="cn">${String(c.id).padStart(2,'0')}</span>
      <span class="cl"><div class="cko">${c.ko}</div><div class="cen">${c.en}</div></span>
      <span class="cnt">${c.words.length}단어</span>
    </div>`).join('');
}
function toggleSB(){document.getElementById('sb').classList.toggle('open');}

// ── State ─────────────────────────────────────────────
let CC=null;      // current category
let CM='list';    // current mode

function showCat(id){
  document.querySelectorAll('.ci').forEach(e=>e.classList.remove('active'));
  const ci=document.getElementById('ci'+id);
  if(ci) ci.classList.add('active');
  document.getElementById('wel').style.display='none';
  document.getElementById('sv').style.display='none';
  document.getElementById('cv').style.display='';
  document.getElementById('srch').value='';
  CC=DATA.find(x=>x.id===id);

  // Category header
  document.getElementById('cat-hdr').style.background=CC.color;
  document.getElementById('cat-hdr').innerHTML=
    `<div><div class="tko">${CC.ko}</div><div class="ten">${CC.en}</div></div>
     <div class="wc">${CC.words.length}단어 · ${Math.ceil(CC.words.length/10)} Sets</div>`;

  // Mode button colors
  document.querySelectorAll('.mbtn').forEach(b=>b.style.background='');
  document.querySelectorAll('.mbtn.active').forEach(b=>{b.style.background=CC.color;b.style.color='#fff';});

  setMode(CM);
  if(window.innerWidth<=700) document.getElementById('sb').classList.remove('open');
  window.scrollTo(0,0);
}

function setMode(m){
  CM=m;
  ['list','card','quiz'].forEach(x=>{
    document.getElementById(x==='list'?'lv':x==='card'?'kv':'qv').style.display=x===m?'':'none';
    const btn=document.getElementById('mb-'+x);
    btn.classList.toggle('active',x===m);
    btn.style.background=x===m&&CC?CC.color:'';
    btn.style.color=x===m?'#fff':'';
  });
  if(m==='list' && CC) renderList();
  else if(m==='card' && CC) initCard();
  else if(m==='quiz' && CC) initQuiz();
}

function renderList(){
  const c=CC; let html='';
  for(let s=0;s<c.words.length;s+=10){
    const sw=c.words.slice(s,s+10);
    const sn=Math.floor(s/10)+1;
    const s1=s+1,s2=Math.min(s+10,c.words.length);
    html+=`<div class="blk">
      <div class="bh" style="background:${c.color}">
        <span>Set ${sn} · ${s1}번 ~ ${s2}번</span>
        <button class="fbt" onclick="openFC(${c.id},${sn-1})">🎴 플래시카드</button>
      </div>
      <table class="wt"><thead><tr>
        <th>No.</th><th>한국어</th><th>English / 예문</th>
        <th style="width:72px;text-align:center">TTS</th>
      </tr></thead><tbody>`;
    sw.forEach((w,i)=>{
      html+=`<tr>
        <td style="color:#bbb;font-size:.78rem">${s+i+1}</td>
        <td><span class="kc">${esc(w.k)}</span></td>
        <td>
          <span class="ec">${esc(w.e)}</span>
          ${w.s?`<div class="sc">${esc(w.s)}</div>`:''}
        </td>
        <td style="text-align:center">
          <button class="tb" onclick="speak('${escq(w.k)}',this)" title="단어 발음">🔊</button>
          ${w.s?`<button class="tb" onclick="speak('${escq(w.s)}',this)" title="예문 듣기">📢</button>`:''}
        </td>
      </tr>`;
    });
    html+=`</tbody></table></div>`;
  }
  document.getElementById('lv').innerHTML=html;
}

// CARD VIEW
// ═══════════════════════════════════════════════════════
let KW=[],KI=0,KF=false,KD='ko',KSF=-1; // words, index, flipped, direction, setFilter

function initCard(){
  KSF=-1; KD='ko'; KI=0; KF=false;
  applyCardFilter();
  renderCardUI();
}

function applyCardFilter(){
  const words=CC.words;
  KW = KSF<0 ? [...words] : words.slice(KSF*10, (KSF+1)*10);
  KI=0; KF=false;
}

function renderCardUI(){
  const c=CC, sets=Math.ceil(c.words.length/10);

  // Set filter buttons
  let sfHtml=`<button class="sfbtn${KSF<0?' active':''}" style="${KSF<0?'background:'+c.color+';color:#fff':''}" onclick="setCardFilter(-1)">전체 (${c.words.length})</button>`;
  for(let s=0;s<sets;s++){
    const isA=KSF===s;
    sfHtml+=`<button class="sfbtn${isA?' active':''}" style="${isA?'background:'+c.color+';color:#fff':''}"
      onclick="setCardFilter(${s})">Set ${s+1}</button>`;
  }

  // Direction buttons
  const dHtml=`<div class="dir-bar">
    <button class="dbtn${KD==='ko'?' active':''}" onclick="setCardDir('ko')">한 → 영 (Korean front)</button>
    <button class="dbtn${KD==='en'?' active':''}" onclick="setCardDir('en')">영 → 한 (English front)</button>
  </div>`;

  document.getElementById('kv').innerHTML=
    `<div class="sf-bar" id="sf-bar">${sfHtml}</div>`+dHtml+
    `<div class="pgbar"><div class="pgtrack"><div class="pgfill" id="pgfill" style="background:${c.color}"></div></div>
      <span class="pgnum" id="pgnum"></span></div>
    <div class="card-wrap"><div class="card" id="kcard" onclick="cardFlip()">
      <div class="card-front" id="cfr"></div>
      <div class="card-back" id="cbk" style="display:none"></div>
    </div></div>
    <div class="card-nav">
      <button class="cnav" onclick="cardNav(-1)">← 이전</button>
      <button class="cflipbtn" id="cflipbtn" onclick="cardFlip()" style="background:${c.color}">뒤집기</button>
      <button class="cnav" onclick="cardNav(1)">다음 →</button>
    </div>`;
  renderCard();
}

function setCardFilter(idx){KSF=idx;applyCardFilter();renderCardUI();}
function setCardDir(d){KD=d;KF=false;renderCardUI();}

function renderCard(){
  if(!KW.length) return;
  const w=KW[KI];
  const pct=KW.length>1?((KI/(KW.length-1))*100).toFixed(1):100;
  document.getElementById('pgfill').style.width=pct+'%';
  document.getElementById('pgnum').textContent=`${KI+1} / ${KW.length}`;

  const front = KD==='ko' ? w.k : w.e;
  const back  = KD==='ko' ? w.e : w.k;
  const sen   = w.s||'';

  document.getElementById('cfr').innerHTML=
    `<div class="cf-ko">${esc(front)}</div>
     <button class="tb spk0" onclick="event.stopPropagation();speak('${escq(front)}',this)">🔊 발음</button>
     <div class="cf-hint">탭하여 뒤집기 · tap to flip</div>`;

  document.getElementById('cbk').innerHTML=
    `<div class="cb-en">${esc(back)}</div>`+
    (sen&&KD==='ko'?`<div class="cb-sen">${esc(sen)}</div>`:'')+
    `<div class="card-tts-row">
       <button class="ctts" onclick="event.stopPropagation();speak('${escq(front)}',this)">🔊 ${KD==='ko'?'한국어':'English'}</button>
       ${sen&&KD==='ko'?`<button class="ctts" onclick="event.stopPropagation();speak('${escq(sen)}',this)">📢 예문</button>`:''}
     </div>`;

  const fr=document.getElementById('cfr');
  const bk=document.getElementById('cbk');
  const btn=document.getElementById('cflipbtn');
  if(KF){
    fr.style.display='none'; bk.style.display='';
    if(btn) btn.textContent='뒤집기 (앞면)';
    document.getElementById('kcard').style.background='#eef2ff';
  } else {
    fr.style.display=''; bk.style.display='none';
    if(btn) btn.textContent='뒤집기';
    document.getElementById('kcard').style.background='#fff';
  }
}

function cardFlip(){KF=!KF;renderCard();}
function cardNav(d){
  KI=Math.max(0,Math.min(KW.length-1,KI+d));
  KF=false; renderCard();
}

// QUIZ VIEW
// ═══════════════════════════════════════════════════════
let QW=[],QI=0,QS=0,QD='koen',QA=null; // words, index, score, direction, answered

function initQuiz(){
  QW=shuffle([...CC.words]);
  QI=0; QS=0; QD='koen'; QA=null;
  renderQuizUI();
}

function renderQuizUI(){
  document.getElementById('qv').innerHTML=
    `<div class="qhdr">
      <span class="qscore" id="qscore">문제 1/${QW.length} · 점수 0</span>
      <button class="qreset" onclick="initQuiz()">↺ 다시 시작</button>
    </div>
    <div class="qdir">
      <button class="qdbtk${QD==='koen'?' active':''}" id="qd-ko" onclick="setQDir('koen')" style="${QD==='koen'?'background:#1a3a5c;color:#fff;border-color:#1a3a5c':'border:2px solid #dde3ef;background:#fff;color:#667'}">한 → 영</button>
      <button class="qdbtk${QD==='enko'?' active':''}" id="qd-en" onclick="setQDir('enko')" style="${QD==='enko'?'background:#1a3a5c;color:#fff;border-color:#1a3a5c':'border:2px solid #dde3ef;background:#fff;color:#667'};padding:5px 16px;border-radius:16px;font-size:.8rem;font-weight:700;cursor:pointer;margin-left:6px">영 → 한</button>
    </div>
    <div class="qprogbar">
      <div class="pgtrack" style="flex:1"><div class="pgfill" id="qpgfill" style="background:${CC.color};width:0%"></div></div>
      <span class="pgnum" id="qpgnum">0/${QW.length}</span>
    </div>
    <div id="qbody"></div>`;
  renderQuizQ();
}

function setQDir(d){QD=d;QI=0;QS=0;QW=shuffle([...CC.words]);renderQuizUI();}

function renderQuizQ(){
  if(QI>=QW.length){
    document.getElementById('qbody').innerHTML=
      `<div class="qcard"><div class="qword">🎉 완료!</div>
       <div class="qpron">점수: ${QS} / ${QW.length} (${Math.round(QS/QW.length*100)}%)</div></div>
       <button class="qnext" style="display:block" onclick="initQuiz()">↺ 다시 시작</button>`;
    return;
  }
  const w=QW[QI];
  const q= QD==='koen' ? w.k : w.e;
  const correct= QD==='koen' ? w.e : w.k;

  // Pick 3 wrong answers from same category
  const others=CC.words.filter(x=>x.k!==w.k);
  const wrong=shuffle([...others]).slice(0,3).map(x=>QD==='koen'?x.e:x.k);
  const opts=shuffle([correct,...wrong]);
  const ci=opts.indexOf(correct);

  QA={correct:ci,answered:false};

  const pct=Math.round(QI/QW.length*100);
  document.getElementById('qpgfill').style.width=pct+'%';
  document.getElementById('qpgnum').textContent=`${QI}/${QW.length}`;
  document.getElementById('qscore').textContent=`문제 ${QI+1}/${QW.length} · 점수 ${QS}`;

  document.getElementById('qbody').innerHTML=
    `<div class="qcard">
       <div class="qword">${esc(q)}</div>
       ${w.s&&QD==='koen'?`<button class="tb" onclick="speak('${escq(w.k)}',this)">🔊</button>`:''}
     </div>
     <div class="qopts">
       ${opts.map((o,i)=>`<button class="opt" id="opt${i}" onclick="answerQ(${i},${ci})">${esc(o)}</button>`).join('')}
     </div>
     <button class="qnext" id="qnext" onclick="nextQ()">다음 →</button>`;
}

function answerQ(idx,correct){
  if(QA.answered) return;
  QA.answered=true;
  document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  document.getElementById('opt'+correct).classList.add('correct');
  if(idx===correct){QS++;}
  else{document.getElementById('opt'+idx).classList.add('wrong');}
  document.getElementById('qnext').style.display='block';
}

function nextQ(){QI++;renderQuizQ();}

// ═══════════════════════════════════════════════════════
// FLASHCARD MODAL (fixed flip)
// ═══════════════════════════════════════════════════════
let FC={words:[],orig:[],i:0,fl:false};

function openFC(cid,si){
  const c=DATA.find(x=>x.id===cid);
  FC.orig=[...c.words.slice(si*10,(si+1)*10)];
  FC.words=[...FC.orig];
  FC.i=0; FC.fl=false;
  document.getElementById('fct').textContent=`${c.ko} · Set ${si+1}`;
  renderFC();
  document.getElementById('fco').classList.add('on');
}

function renderFC(){
  const w=FC.words[FC.i];
  // Front: Korean only
  document.getElementById('fcf').textContent=w.k;
  document.getElementById('fcf').style.display=FC.fl?'none':'';
  // Back: English + sentence (hidden when not flipped)
  document.getElementById('fcen').textContent=w.e;
  document.getElementById('fcen').style.display=FC.fl?'':'none';
  document.getElementById('fcsen').textContent=w.s||'';
  document.getElementById('fcsen').style.display=(FC.fl&&w.s)?'':'none';
  // Hint
  document.getElementById('fch').style.display=FC.fl?'none':'';
  document.getElementById('fck').textContent=`${FC.i+1} / ${FC.words.length}`;
  document.getElementById('fcd').style.background=FC.fl?'#eef2ff':'#f7f9fc';
}

function fcFlip(){
  FC.fl=!FC.fl; renderFC();
  if(FC.fl) speak(FC.words[FC.i].k);
}
function fcmv(d){
  FC.i=Math.max(0,Math.min(FC.words.length-1,FC.i+d));
  FC.fl=false; renderFC();
}
function fcShuffle(){
  FC.words=shuffle([...FC.orig]);
  FC.i=0; FC.fl=false; renderFC();
}
function fcSpeak(field){
  const w=FC.words[FC.i];
  speak(field==='s'?(w.s||w.k):w.k);
}
function closeFC(){document.getElementById('fco').classList.remove('on');speechSynthesis.cancel();}
function fcoOut(e){if(e.target===document.getElementById('fco'))closeFC();}

// ── Utilities ─────────────────────────────────────────
function shuffle(a){
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

// ── Search ────────────────────────────────────────────
function doSearch(q){
  q=q.trim();
  if(!q){
    if(CC){document.getElementById('cv').style.display='';
           document.getElementById('sv').style.display='none';}
    else{document.getElementById('wel').style.display='';
         document.getElementById('sv').style.display='none';}
    return;
  }
  document.getElementById('wel').style.display='none';
  document.getElementById('cv').style.display='none';
  document.getElementById('sv').style.display='';
  const ql=q.toLowerCase(),res=[];
  DATA.forEach(c=>c.words.forEach(w=>{
    if(w.k.includes(q)||w.e.toLowerCase().includes(ql)||w.s.includes(q))
      res.push({...w,cko:c.ko,cc:c.color});
  }));
  if(!res.length){document.getElementById('so').innerHTML='<p style="color:#aaa;padding:20px">결과 없음</p>';return;}
  document.getElementById('so').innerHTML=
    `<p style="color:#aaa;margin-bottom:10px">${res.length}개</p>
    <div class="blk" style="overflow:hidden">
    <table class="wt"><thead><tr>
      <th>카테고리</th><th>한국어</th><th>English / 예문</th>
      <th style="width:72px;text-align:center">TTS</th>
    </tr></thead><tbody>`+
    res.map(r=>`<tr>
      <td><span class="stag" style="background:${r.cc}">${esc(r.cko)}</span></td>
      <td class="kc">${esc(r.k)}</td>
      <td><span class="ec">${esc(r.e)}</span>${r.s?`<div class="sc">${esc(r.s)}</div>`:''}</td>
      <td style="text-align:center">
        <button class="tb" onclick="speak('${escq(r.k)}',this)">🔊</button>
        ${r.s?`<button class="tb" onclick="speak('${escq(r.s)}',this)">📢</button>`:''}
      </td>
    </tr>`).join('')+
    '</tbody></table></div>';
}

// ── Keyboard ──────────────────────────────────────────
document.addEventListener('keydown',e=>{
  if(document.getElementById('fco').classList.contains('on')){
    if(e.key==='ArrowLeft')fcmv(-1);
    else if(e.key==='ArrowRight')fcmv(1);
    else if(e.key===' '){e.preventDefault();fcFlip();}
    else if(e.key==='Escape')closeFC();
    return;
  }
  if(CM==='card'&&CC){
    if(e.key==='ArrowLeft')cardNav(-1);
    else if(e.key==='ArrowRight')cardNav(1);
    else if(e.key===' '){e.preventDefault();cardFlip();}
  }
});

renderSidebar();
</script>
